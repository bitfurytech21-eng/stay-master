name: Regenerate static website pages
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'build_pages.py'
      - 'build_city.py'
      - 'build_building.py'
      - 'build_building_parts.py'
      - 'build_extra.py'
      - 'make_404.py'
      - 'data/**'
      - '.github/workflows/regenerate-site.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate committed HTML
        run: |
          # A generator failure must not fail the workflow or leave the site in
          # a half-written state: the committed pages stay as they are.
          python build.py || echo "build.py failed - keeping committed pages"
          python build_extra.py || echo "build_extra.py failed - keeping committed pages"
          python make_404.py || echo "make_404.py failed - keeping committed pages"
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is hand-maintained (a bespoke design that does not share
          # the city/building layout), so it is deliberately excluded here:
          # regenerating the site must never revert the homepage.
          git add -A -- '*.html' ':!index.html'
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
            exit 0
          fi
          git commit -m "Regenerate static pages from site templates"
          git push
