name: Regenerate static website pages
on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'build_pages.py'
      - 'build_city.py'
      - 'build_building.py'
      - 'build_building_parts.py'
      - 'build_property_content.py'
      - 'build_inventory.py'
      - 'make_rates.py'
      - 'build_extra.py'
      - 'make_404.py'
      - 'data/**'
      - '.github/workflows/regenerate-site.yml'
  workflow_dispatch:
permissions:
  contents: write

# Only one generator may commit regenerated pages at a time.
concurrency:
  group: regenerate-static-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate committed HTML
        run: |
          # Fail the workflow if any generator fails. Publishing stale generated
          # pages after a generator error can silently leave broken content live.
          python build.py
          python build_extra.py
          python make_404.py
          python make_rates.py
          python build_inventory.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # index.html is generated by build.py and must be committed with
          # the other pages. Leaving a placeholder here breaks the Render root URL.
          git add -A -- '*.html'
          # inventory.json is generated from data/site.json and is what makes
          # the booking search work on a static host.
          git add -A -- inventory.json
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
            exit 0
          fi
          git commit -m "Regenerate static pages from site templates"
          git push
