name: Deploy site to GitHub Pages

# Publishes the committed static site so the repository has a real, working
# deployed link instead of only files sitting in the repo.
#
# The frontend finds the backend through window.STAY_MASTER_API. On Pages there
# is no /api proxy, so this workflow injects the API origin into every page as
# a <meta name="stay-master-api"> tag plus an inline resolver, taken from the
# repository variable STAY_MASTER_API_BASE (Settings -> Secrets and variables ->
# Actions -> Variables). Set it to the deployed API origin, e.g.
#   https://stay-master-api.onrender.com
# If the variable is unset the site still deploys and simply uses same-origin
# /api paths, which is correct when the site is served by the Render service
# that proxies /api.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate pages from templates
        run: |
          set -e
          python -V
          for script in build.py build_extra.py make_404.py make_rates.py make_backend_rates.py build_inventory.py; do
            echo "::group::python $script"
            python "$script"
            echo "::endgroup::"
          done

      - name: Point the frontend at the deployed API
        env:
          API_BASE: ${{ vars.STAY_MASTER_API_BASE }}
        run: |
          python - <<'PY'
          import os, pathlib, re

          base = (os.environ.get("API_BASE") or "").strip().rstrip("/")
          if not base:
              print("STAY_MASTER_API_BASE is not set - keeping same-origin /api paths.")
              raise SystemExit(0)

          tag = '<meta name="stay-master-api" content="%s">' % base
          # A self-contained resolver, inlined so it works even on pages that do
          # not load api-config.js. It defines window.STAY_MASTER_API exactly as
          # api-config.js does, so every script can call STAY_MASTER_API.url().
          resolver = (
              '<script>window.STAY_MASTER_API_BASE=%r;'
              'window.STAY_MASTER_API=(function(){var b=String(window.STAY_MASTER_API_BASE||"")'
              '.replace(/\\/+$/,"");return{base:b,url:function(p){p=String(p||"");'
              'if(!p)return b;if(p.charAt(0)!=="/")p="/"+p;return b+p;},'
              'crossOrigin:b!==""};})();</script>' % base
          )
          changed = 0
          for path in pathlib.Path(".").glob("*.html"):
              text = path.read_text(encoding="utf-8")
              if 'name="stay-master-api"' in text:
                  continue
              # Insert right after the viewport meta so it is available before
              # any script runs.
              new, n = re.subn(
                  r'(<meta name="viewport"[^>]*>)',
                  r'\1\n' + tag + '\n' + resolver,
                  text,
                  count=1,
              )
              if n:
                  path.write_text(new, encoding="utf-8")
                  changed += 1
          print("Injected API base into %d pages: %s" % (changed, base))
          PY

      - name: Disable Jekyll processing
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
