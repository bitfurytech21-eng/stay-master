# Single-origin Stayawhile Master deployment.
# One Render Node web service serves the frontend and backend API together.
# Render builds from the repository root; backend dependencies and server are
# managed from ./backend while the root frontend is served by Express.
services:
  - type: web
    name: stay-master-backend2
    runtime: node
    branch: main
    autoDeploy: true
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATA_DIR
        value: /var/data
      - key: ENQUIRY_TO
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENQUIRY_FROM
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MANUAL_BANK_TRANSFER_ENABLED
        value: "false"
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ACCOUNT_CURRENCY
        sync: false
      - key: BANK_SORT_CODE
        sync: false
      - key: BANK_IBAN
        sync: false
      - key: BANK_SWIFT
        sync: false
      - key: BANK_TRANSFER_INSTRUCTIONS
        sync: false
    disk:
      name: stay-master-data
      mountPath: /var/data
      sizeGB: 1
