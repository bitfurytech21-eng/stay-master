# Single-origin Stay Master deployment.
# One Render Node service serves both the static website and /api/* routes.
# Public site and API therefore share the same hostname and deployment.
services:
  - type: web
    name: stay-master-backend2
    runtime: node
    buildCommand: npm --prefix backend ci
    startCommand: npm --prefix backend start
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: DATA_DIR
        value: /var/data
      - key: ENQUIRY_TO
        value: easytravelagency@trustagent.space
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENQUIRY_FROM
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      # Retained for intentional cross-origin previews; same-origin production
      # requests do not require CORS configuration.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MANUAL_BANK_TRANSFER_ENABLED
        value: "false"
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ACCOUNT_CURRENCY
        sync: false
      - key: BANK_SORT_CODE
        sync: false
      - key: BANK_IBAN
        sync: false
      - key: BANK_SWIFT
        sync: false
      - key: BANK_TRANSFER_INSTRUCTIONS
        sync: false
    disk:
      name: stay-master-data
      mountPath: /var/data
      sizeGB: 1
