# Render blueprint for the master site.
#
# Two services:
#   1. stay-master      — the static site (pre-generated HTML, no build step)
#   2. stay-master-api  — the enquiry form backend (Node + SQLite + SMTP)
#
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
#
# The static service rewrites /api/* to the API service, so the form can post to
# the same-origin path /api/enquiries and no CORS setup is needed.

services:
  # ---------------------------------------------------------------- static site
  - type: web
    name: stay-master
    runtime: static
    rootDir: .
    staticPublishPath: .
    buildCommand: ""
    pullRequestPreviewsEnabled: true
    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /vendor/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /styles.css
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /script.js
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
    routes:
      # Proxy the form endpoint to the API service (same-origin for the browser).
      - type: rewrite
        source: /api/*
        destination: https://stay-master-backend2.onrender.com/api/*
      # Anything unknown gets the custom 404 page.
      - type: rewrite
        source: /*
        destination: /404.html

  # ---------------------------------------------------------------- enquiry API
  - type: web
    name: stay-master-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      # Allow secure guest-session cookies when GitHub Pages calls the API cross-origin.
      - key: COOKIE_CROSS_SITE
        value: "true"
      # Where enquiry submissions are stored. Mount a Render disk at /var/data
      # so the SQLite file survives deploys and restarts.
      - key: DATA_DIR
        value: /var/data
      - key: ENQUIRY_TO
        value: easytravelagency@trustagent.space
      # Set the following in the Render dashboard (marked sync: false so they
      # are never committed to the repo):
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: ENQUIRY_FROM
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # Private-network connection to the self-hosted LibreTranslate service.
      - key: LIBRETRANSLATE_HOST
        fromService:
          name: stay-master-translator
          type: pserv
          property: host
      # Manual checkout is disabled until verified bank settlement details are configured.
      - key: MANUAL_BANK_TRANSFER_ENABLED
        value: "false"
      - key: BANK_NAME
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT_NUMBER
        sync: false
      - key: BANK_ACCOUNT_CURRENCY
        sync: false
      - key: BANK_SORT_CODE
        sync: false
      - key: BANK_IBAN
        sync: false
      - key: BANK_SWIFT
        sync: false
      - key: BANK_TRANSFER_INSTRUCTIONS
        sync: false
    disk:
      name: enquiries-data
      mountPath: /var/data
      sizeGB: 1

  # ------------------------------------------------ self-hosted translation
  # LibreTranslate runs privately inside Render; it is not exposed publicly.
  # First startup downloads open-source language models to the persistent disk.
  - type: pserv
    name: stay-master-translator
    runtime: image
    region: oregon
    plan: 1c-2g
    image:
      url: docker.io/libretranslate/libretranslate:latest
    envVars:
      - key: LT_HOST
        value: 0.0.0.0
      - key: LT_PORT
        value: "5000"
      - key: LT_DISABLE_WEB_UI
        value: "true"
      - key: LT_REQ_LIMIT
        value: "60"
      - key: LT_CHAR_LIMIT
        value: "1000"
      - key: LT_THREADS
        value: "2"
    disk:
      name: translation-models
      mountPath: /home/libretranslate/.local
      sizeGB: 10
